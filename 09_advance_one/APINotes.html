    DID YOU KNOW ? 
    ------------------

    1. Console.log, document are not part of core JS. Technically they are
    and they are not. Core JS consists of basic arithmetic operations, functions
    and loops etc.

    For example, console.log() is a debugging tool / dev tool for the browser
    This tool is injected by JS runtime.

    V8 engine, one of the most well known JS runtime engines are run on CPP code underneath.
    Same is the case with Python.

    You can say that the JS kind of a wrapper on top of C++.
